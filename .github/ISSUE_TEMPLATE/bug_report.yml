name: Bug report
description: Report a problem in the DynoTable app.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Never paste AWS credentials, access keys, session tokens or table data in an issue. Replace real values with placeholders.

        To report a security problem, send an email to support@dynotable.com. Do not open an issue.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.18.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: macOS 26.1, Windows 11 24H2, Ubuntu 24.04
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a table.
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error message, if there is one. Remove credentials and table data first.
    validations:
      required: true
